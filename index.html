<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>YourMood — Daily Log & Monthly Report</title>
<style>
  :root{
    --bg:#fafafa; --fg:#222; --muted:#6b7280; --card:#fff; --brand:#ffcd4a; --brand-2:#ffb100;
    --ok:#22c55e; --warn:#ef4444; --chip:#f3f4f6; --chip-on:#111827; --chip-on-fg:#fff;
    --ring:rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple Color Emoji,Segoe UI Emoji,sans-serif;
       background:var(--bg); color:var(--fg); margin:0; padding:24px}
  .wrap{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:360px 1fr; gap:20px}
  header{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .logo{font-size:22px}
  .app{background:var(--card); border-radius:16px; box-shadow:0 1px 4px var(--ring)}
  .section{padding:18px 18px 8px}
  .section h3{margin:8px 0 10px}
  .row{display:flex; align-items:center; gap:10px}
  .muted{color:var(--muted); font-size:13px}
  .btn{background:var(--brand); border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600}
  .btn:hover{background:var(--brand-2)}
  .btn-outline{background:#fff;border:1px solid #e5e7eb}
  .pill{padding:6px 10px;border-radius:999px; background:var(--chip); cursor:pointer; user-select:none}
  .pill.on{background:var(--chip-on); color:var(--chip-on-fg)}
  input[type=text], textarea, select{
    width:100%; border:1px solid #e5e7eb; border-radius:10px; padding:8px 10px; font-size:14px;
    background:#fff;
  }
  textarea{min-height:80px; resize:vertical}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .emoji-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:8px; margin-top:8px}
  .emoji{font-size:26px; line-height:46px; text-align:center; border-radius:12px; background:#fff; border:1px solid #eee; cursor:pointer; user-select:none}
  .emoji:hover{transform:scale(1.06)}
  .emoji.sel{outline:3px solid #fde68a}
  .bar{display:flex; align-items:center; gap:8px; justify-content:space-between}
  .calendar{padding:0 18px 18px}
  .cal-head{display:flex; align-items:center; justify-content:space-between; padding:8px 0}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:8px}
  .dow{font-size:12px; color:var(--muted); text-align:center}
  .cell{background:#fff; border:1px solid #eee; border-radius:12px; min-height:76px; padding:6px; position:relative; cursor:pointer}
  .cell.today{border-color:#ffcd4a}
  .cell .d{font-size:13px; color:#6b7280}
  .dot{position:absolute; right:8px; bottom:8px; width:12px; height:12px; border-radius:50%}
  .legend{display:flex; gap:8px; flex-wrap:wrap; padding:6px 0 10px}
  .stat{padding:10px 14px; background:#fff; border:1px solid #eee; border-radius:12px}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .lock{font-size:12px; color:#f97316; font-weight:700}
  .right-card{padding-bottom:18px}
  .divider{height:1px; background:#f1f5f9; margin:10px 0}
  .help{padding:0 18px 12px}
  .right-fixed{position:sticky; top:16px}
  @media (max-width:980px){ .wrap{grid-template-columns:1fr} .right-fixed{position:static} }
</style>
</head>
<body>
  <header class="bar" style="max-width:1100px;margin:0 auto 12px;">
    <div class="row">
      <div class="logo">🟡</div>
      <strong>YourMood</strong>
      <span class="muted">Daily Log • Monthly Report</span>
    </div>
    <div class="row muted">
      <span id="status" class="muted">Ready</span>
    </div>
  </header>

  <div class="wrap">
    <!-- LEFT: Monthly report + calendar -->
    <div class="app">
      <div class="section">
        <h3>Monthly Report</h3>
        <div class="chips" id="tagChips"></div>
        <div class="legend" id="legend"></div>
        <div class="grid2">
          <div class="stat"><b id="statEntries">0</b><div class="muted">entries this month</div></div>
          <div class="stat"><b id="statTopTag">—</b><div class="muted">top tag</div></div>
        </div>
      </div>

      <div class="calendar">
        <div class="cal-head">
          <button class="btn btn-outline" id="prevMonth">◀</button>
          <div><b id="monthTitle">Month YYYY</b></div>
          <div class="row">
            <button class="btn btn-outline" id="todayBtn">Today</button>
            <button class="btn btn-outline" id="nextMonth">▶</button>
          </div>
        </div>
        <div class="cal-grid" id="dow">
          <div class="dow">Sun</div><div class="dow">Mon</div><div class="dow">Tue</div><div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="help muted">Per-day save. Click any date to load & edit that day.</div>
      </div>
    </div>

    <!-- RIGHT: Editor -->
    <div class="app right-fixed right-card">
      <div class="section">
        <div class="bar">
          <h3 id="editorDate">Today</h3>
          <div class="row">
            <label class="muted" style="display:flex;align-items:center;gap:6px;">
              <input type="checkbox" id="lockAfterSave"> Lock after save
            </label>
          </div>
        </div>

        <div>
          <label>Mood</label>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <div class="divider"></div>

        <div class="grid2">
          <div>
            <label>Question of the Day *</label>
            <input id="qod" type="text" readonly />
          </div>
          <div>
            <label>Require answer</label>
            <select id="requireMode">
              <option value="auto">Auto</option>
              <option value="on">On</option>
              <option value="off">Off</option>
            </select>
          </div>
        </div>

        <label style="margin-top:14px;">Your Answer *</label>
        <textarea id="answer" placeholder="Type your answer…"></textarea>

        <div class="grid2" style="margin-top:14px;">
          <div>
            <label>Tags (comma-separated)</label>
            <input id="tags" type="text" placeholder="work, school, home…" />
          </div>
          <div>
            <label>Quick Tags</label>
            <div class="chips" id="quickTags"></div>
          </div>
        </div>

        <label style="margin-top:14px;">Optional Notes</label>
        <textarea id="note" placeholder="Why did you feel this way? Any context…"></textarea>

        <div class="bar" style="margin-top:14px;">
          <div class="row">
            <button class="btn" id="saveBtn">💾 Save</button>
            <button class="btn btn-outline" id="unlockBtn" title="Enable editing if entry is locked">Unlock</button>
          </div>
          <div class="muted" id="lockBadge" style="display:none;"><span class="lock">Locked</span></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* =========================
   Data & Utilities
========================= */
const EMOJIS = [
  "😀","😄","😁","😆","😊","😍","🤗","😌","😴","🤔",
  "😕","😞","😢","😭","😠","😤","😡","😩","😫","😱",
  "🤩","😇","😶‍🌫️","😐","😎","🥰","🥲","😤","😤","🥳"
];
const TAGS = ["all","work","school","home","friends","gathering","outdoors","travel","family","study","health","exercise","food","music","weather","stress","calm","finance","love","project"];
const QUICK_TAGS = ["work","school","home","friends","gathering","outdoors","study","health","exercise","family"];
const MOOD_COLORS = {
  "😀":"#22c55e","😄":"#22c55e","😁":"#16a34a","😆":"#10b981","😊":"#84cc16",
  "😍":"#f59e0b","🤗":"#f59e0b","😌":"#60a5fa","😴":"#a78bfa","🤔":"#93c5fd",
  "😕":"#fca5a5","😞":"#f87171","😢":"#ef4444","😭":"#dc2626","😠":"#ef4444",
  "😤":"#fb923c","😡":"#b91c1c","😩":"#f97316","😫":"#ea580c","😱":"#f43f5e",
  "🤩":"#eab308","😇":"#fde047","😶‍🌫️":"#94a3b8","😐":"#9ca3af","😎":"#06b6d4","🥰":"#fb7185","🥲":"#60a5fa","🥳":"#f59e0b"
};
const QOD_LIST = [
  "What made you smile today?",
  "One thing you’re grateful for?",
  "Who did you think about today, and why?",
  "What challenged you today?",
  "What energized you?",
  "A small win you had?",
  "What would you like to improve tomorrow?",
  "Where did you spend most of your time?",
  "Which song matched your mood?",
  "What’s one kind thing you did?",
  "What stressed you today?",
  "What gave you peace today?",
  "What are you proud of today?",
  "What surprised you today?",
  "What did you learn today?",
  "How did you care for yourself?",
  "What did you avoid today?",
  "What did you finish today?",
  "What gave you hope today?",
  "What’s a word for today?"
];
const LS_KEY = "yourmood.entries.v1";

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

const todayKey = () => new Date().toISOString().slice(0,10);
const toKey = (d) => d.toISOString().slice(0,10);
const fromLS = () => JSON.parse(localStorage.getItem(LS_KEY) || "{}");
const toLS = (o) => localStorage.setItem(LS_KEY, JSON.stringify(o));

function hashDay(iso){
  // deterministic index for QOD per day
  let h = 0;
  for (const ch of iso) h = (h*31 + ch.charCodeAt(0)) % 2147483647;
  return h;
}

/* =========================
   State
========================= */
let state = {
  monthCursor: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  selectedDay: todayKey(),
  filterTag: "all",
  requireMode: localStorage.getItem("requireMode") || "auto"
};

/* =========================
   UI: Calendar & Report
========================= */
const calGrid = $("#calGrid");
const monthTitle = $("#monthTitle");
const tagChips = $("#tagChips");
const legend = $("#legend");
const statEntries = $("#statEntries");
const statTopTag = $("#statTopTag");

function renderTagChips(){
  tagChips.innerHTML = "";
  TAGS.forEach(t=>{
    const el = document.createElement("div");
    el.className = "pill" + (t===state.filterTag?" on":"");
    el.textContent = t;
    el.addEventListener("click", ()=>{
      state.filterTag = t;
      renderCalendar();
      renderReport();
      renderLegend();
    });
    tagChips.appendChild(el);
  });
}
function renderLegend(){
  legend.innerHTML = "";
  const used = new Set(Object.values(fromLS()).map(e=>e.mood));
  EMOJIS.forEach(m=>{
    if(!MOOD_COLORS[m]) return;
    const chip = document.createElement("div");
    chip.className = "pill";
    chip.innerHTML = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${MOOD_COLORS[m]};margin-right:6px;vertical-align:middle"></span>${m}`;
    legend.appendChild(chip);
  });
}

function renderCalendar(){
  const d0 = new Date(state.monthCursor);
  const year = d0.getFullYear(), month = d0.getMonth();
  monthTitle.textContent = d0.toLocaleString(undefined,{month:"long", year:"numeric"});

  // build grid
  calGrid.innerHTML = "";
  const first = new Date(year, month, 1);
  const startCol = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // leading blanks
  for(let i=0;i<startCol;i++){
    const blank = document.createElement("div");
    calGrid.appendChild(blank);
  }

  const data = fromLS();
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const key = toKey(d);
    const cell = document.createElement("div");
    cell.className = "cell" + (key===todayKey() ? " today": "");
    cell.innerHTML = `<div class="d">${day}</div>`;
    const entry = data[key];

    // filter by tag when drawing dot
    let showDot = !!entry;
    if (showDot && state.filterTag!=="all"){
      const tags = (entry.tags || "").split(",").map(s=>s.trim()).filter(Boolean);
      showDot = tags.includes(state.filterTag);
    }
    if (showDot && entry && entry.mood){
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.background = MOOD_COLORS[entry.mood] || "#94a3b8";
      cell.appendChild(dot);
    }

    cell.addEventListener("click", ()=>{
      state.selectedDay = key;
      loadEditorForDay(key);
      $("#editorDate").textContent = new Date(key).toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
      flashStatus(`Loaded ${key}`);
    });

    calGrid.appendChild(cell);
  }
}

function renderReport(){
  const data = fromLS();
  const year = state.monthCursor.getFullYear();
  const month = state.monthCursor.getMonth();
  let cnt = 0;
  const tagCount = {};
  Object.entries(data).forEach(([k,e])=>{
    const d = new Date(k);
    if (d.getFullYear()===year && d.getMonth()===month){
      // filter tag
      if (state.filterTag!=="all"){
        const tags = (e.tags || "").split(",").map(s=>s.trim()).filter(Boolean);
        if (!tags.includes(state.filterTag)) return;
      }
      cnt++;
      (e.tags || "").split(",").map(s=>s.trim()).filter(Boolean).forEach(t=>{
        tagCount[t] = (tagCount[t]||0)+1;
      });
    }
  });
  statEntries.textContent = cnt;
  const top = Object.entries(tagCount).sort((a,b)=>b[1]-a[1])[0];
  statTopTag.textContent = top ? `${top[0]} (${top[1]})` : "—";
}

/* =========================
   UI: Editor
========================= */
const emojiGrid = $("#emojiGrid");
const qod = $("#qod");
const answer = $("#answer");
const tags = $("#tags");
const note = $("#note");
const saveBtn = $("#saveBtn");
const unlockBtn = $("#unlockBtn");
const requireModeSel = $("#requireMode");
const lockAfterSave = $("#lockAfterSave");
const lockBadge = $("#lockBadge");
const quickTags = $("#quickTags");

function renderEmojis(selected){
  emojiGrid.innerHTML = "";
  EMOJIS.forEach(e=>{
    const div = document.createElement("div");
    div.className = "emoji" + (selected===e ? " sel":"");
    div.textContent = e;
    div.title = "Select mood";
    div.onclick = () => {
      $$(".emoji").forEach(x=>x.classList.remove("sel"));
      div.classList.add("sel");
      div.dataset.sel = "1";
      div.blur();
    };
    emojiGrid.appendChild(div);
  });
}
function selectedEmoji(){
  const el = $(".emoji.sel");
  return el ? el.textContent : null;
}
function setSelectedEmoji(m){
  $$(".emoji").forEach(x=>x.classList.remove("sel"));
  if (!m) return;
  const el = Array.from($$(".emoji")).find(x=>x.textContent===m);
  if (el) el.classList.add("sel");
}
function renderQuickTags(){
  quickTags.innerHTML = "";
  QUICK_TAGS.forEach(t=>{
    const el = document.createElement("div");
    el.className = "pill";
    el.textContent = t;
    el.onclick = ()=>{
      const list = new Set(tags.value.split(",").map(s=>s.trim()).filter(Boolean));
      if (list.has(t)) list.delete(t); else list.add(t);
      tags.value = Array.from(list).join(", ");
    };
    quickTags.appendChild(el);
  });
}
function loadEditorForDay(key){
  const data = fromLS();
  const e = data[key] || {};
  renderEmojis(e.mood);
  tags.value = e.tags || "";
  note.value = e.note || "";
  answer.value = e.answer || "";
  requireModeSel.value = localStorage.getItem("requireMode") || "auto";
  lockAfterSave.checked = !!e.locked;
  lockBadge.style.display = e.locked ? "block":"none";
  setInputsDisabled(!!e.locked);

  // deterministic QOD by date
  const idx = hashDay(key) % QOD_LIST.length;
  qod.value = QOD_LIST[idx];
}
function setInputsDisabled(disabled){
  [answer, tags, note, saveBtn, ...$$(".emoji")].forEach(el=>{
    el.disabled = disabled;
    if (disabled) el.classList.add("disabled"); else el.classList.remove("disabled");
  });
}
function validateBeforeSave(key){
  const mode = requireModeSel.value;
  localStorage.setItem("requireMode", mode);
  const needAnswer = (mode==="on") || (mode==="auto" && qod.value.trim().length>0);
  if (!selectedEmoji()) return "Please select a mood.";
  if (needAnswer && !answer.value.trim()) return "Please answer the Question of the Day.";
  return null;
}
function flashStatus(t){
  const el = $("#status");
  el.textContent = t;
  el.style.opacity = "1";
  setTimeout(()=>{ el.style.opacity = ".75"; }, 1200);
}

/* =========================
   Events
========================= */
$("#prevMonth").onclick = ()=>{ state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()-1, 1); renderCalendar(); renderReport(); };
$("#nextMonth").onclick = ()=>{ state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()+1, 1); renderCalendar(); renderReport(); };
$("#todayBtn").onclick = ()=>{ state.monthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1); state.selectedDay = todayKey(); loadEditorForDay(state.selectedDay); renderCalendar(); renderReport(); $("#editorDate").textContent = "Today"; };

saveBtn.onclick = ()=>{
  const key = state.selectedDay;
  const err = validateBeforeSave(key);
  if (err){ alert(err); return; }
  const data = fromLS();
  data[key] = {
    date: key,
    mood: selectedEmoji(),
    question: qod.value,
    answer: answer.value.trim(),
    tags: tags.value.trim(),
    note: note.value.trim(),
    locked: !!lockAfterSave.checked
  };
  toLS(data);
  if (lockAfterSave.checked){ setInputsDisabled(true); lockBadge.style.display="block"; }
  renderCalendar(); renderReport();
  flashStatus("Saved ✅");
};

unlockBtn.onclick = ()=>{
  const key = state.selectedDay;
  const data = fromLS();
  if (!data[key]) return;
  data[key].locked = false;
  toLS(data);
  setInputsDisabled(false);
  lockAfterSave.checked = false;
  lockBadge.style.display="none";
  flashStatus("Unlocked ✨");
};

requireModeSel.onchange = ()=>{
  localStorage.setItem("requireMode", requireModeSel.value);
};

/* =========================
   Boot
========================= */
(function init(){
  renderTagChips();
  renderLegend();
  renderReport();
  renderQuickTags();
  $("#editorDate").textContent = "Today";
  state.selectedDay = todayKey();
  loadEditorForDay(state.selectedDay);
  renderCalendar();
})();
</script>
</body>
</html>
